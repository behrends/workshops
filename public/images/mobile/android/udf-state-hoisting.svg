<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Unidirectional Data Flow: State nach unten, Events nach oben</title>
  <defs>
    <marker id="down" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
  </defs>
  <rect width="800" height="420" fill="#ffffff"/>

  <!-- Eltern-Composable mit State -->
  <rect x="150" y="30" width="500" height="100" rx="14" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
  <text x="400" y="68" text-anchor="middle" font-size="24" font-weight="600" fill="#1e1b4b">WeatherScreen</text>
  <text x="400" y="104" text-anchor="middle" font-size="17" font-family="ui-monospace, Menlo, monospace" fill="#312e81">var useCelsius by rememberSaveable { … }</text>

  <!-- Kinder -->
  <rect x="60" y="280" width="280" height="90" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="200" y="320" text-anchor="middle" font-size="22" font-weight="600" fill="#0f172a">UnitToggle</text>
  <text x="200" y="350" text-anchor="middle" font-size="15" fill="#475569">stateless</text>

  <rect x="460" y="280" width="280" height="90" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="600" y="320" text-anchor="middle" font-size="22" font-weight="600" fill="#0f172a">CurrentWeatherCard</text>
  <text x="600" y="350" text-anchor="middle" font-size="15" fill="#475569">stateless</text>

  <!-- State nach unten -->
  <line x1="290" y1="130" x2="230" y2="276" stroke="#1d4ed8" stroke-width="3" marker-end="url(#down)"/>
  <line x1="500" y1="130" x2="590" y2="276" stroke="#1d4ed8" stroke-width="3" marker-end="url(#down)"/>
  <text x="560" y="200" font-size="17" fill="#1d4ed8" font-weight="600">State ↓</text>
  <text x="560" y="222" font-size="15" font-family="ui-monospace, Menlo, monospace" fill="#1d4ed8">useCelsius</text>

  <!-- Event nach oben -->
  <line x1="150" y1="276" x2="240" y2="134" stroke="#c2410c" stroke-width="3" marker-end="url(#up)"/>
  <text x="60" y="190" font-size="17" fill="#c2410c" font-weight="600">Event ↑</text>
  <text x="60" y="212" font-size="15" font-family="ui-monospace, Menlo, monospace" fill="#c2410c">onToggle()</text>
</svg>
