<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Layout als verschachtelte Boxen: Bildschirm und Code haben denselben Aufbau</title>
  <rect width="800" height="440" fill="#ffffff"/>

  <!-- Links: die Karte als verschachtelte Rahmen -->
  <rect x="30" y="40" width="360" height="360" rx="18" fill="#eef2ff" stroke="#4338ca" stroke-width="2.5"/>
  <text x="44" y="62" font-size="14" font-weight="700" fill="#4338ca">Container</text>

  <rect x="55" y="75" width="310" height="305" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5"/>
  <text x="67" y="96" font-size="14" font-weight="700" fill="#0f766e">Column</text>

  <rect x="150" y="105" width="120" height="36" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="210" y="130" text-anchor="middle" font-size="20" fill="#0f172a">Lörrach</text>

  <rect x="170" y="148" width="80" height="62" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="210" y="194" text-anchor="middle" font-size="40">⛅</text>

  <rect x="140" y="217" width="140" height="52" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="210" y="255" text-anchor="middle" font-size="34" fill="#0f172a">14 °C</text>

  <rect x="150" y="276" width="120" height="16" rx="4" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="210" y="288" text-anchor="middle" font-size="11" fill="#64748b">SizedBox</text>

  <rect x="70" y="299" width="280" height="68" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/>
  <text x="80" y="315" font-size="13" font-weight="700" fill="#b45309">Row</text>

  <rect x="80" y="322" width="110" height="34" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="135" y="344" text-anchor="middle" font-size="13" fill="#0f172a">Wind: 8 km/h</text>

  <rect x="194" y="322" width="20" height="34" rx="4" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>

  <rect x="218" y="322" width="124" height="34" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="280" y="344" text-anchor="middle" font-size="12" fill="#0f172a">Teilweise bewölkt</text>

  <!-- Rechts: derselbe Aufbau im Code -->
  <line x1="438" y1="82" x2="438" y2="388" stroke="#4338ca" stroke-width="3" stroke-linecap="round"/>
  <line x1="462" y1="108" x2="462" y2="362" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/>
  <line x1="486" y1="238" x2="486" y2="336" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>

  <g font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#334155">
    <text x="446" y="88"><tspan fill="#4338ca" font-weight="700">Container</tspan>(</text>
    <text x="470" y="114">child: <tspan fill="#0f766e" font-weight="700">Column</tspan>(children: [</text>
    <text x="494" y="140"><tspan fill="#475569" font-weight="700">Text</tspan>('Lörrach'),</text>
    <text x="494" y="166"><tspan fill="#475569" font-weight="700">Text</tspan>('⛅'),</text>
    <text x="494" y="192"><tspan fill="#475569" font-weight="700">Text</tspan>('14 °C'),</text>
    <text x="494" y="218"><tspan fill="#64748b">SizedBox</tspan>(),</text>
    <text x="494" y="244"><tspan fill="#b45309" font-weight="700">Row</tspan>(children: [</text>
    <text x="518" y="270"><tspan fill="#475569" font-weight="700">Text</tspan>('Wind …'),</text>
    <text x="518" y="296"><tspan fill="#64748b">Spacer</tspan>(),</text>
    <text x="518" y="322"><tspan fill="#475569" font-weight="700">Text</tspan>('Teilweise …'),</text>
    <text x="494" y="348">]),</text>
    <text x="470" y="374">]),</text>
    <text x="446" y="400">)</text>
  </g>
</svg>
