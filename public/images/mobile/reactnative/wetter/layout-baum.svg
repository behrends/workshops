<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Layout als verschachtelte Views: Bildschirm und Code haben denselben Aufbau</title>
  <rect width="800" height="440" fill="#ffffff"/>

  <!-- Links: die Karte als verschachtelte Rahmen -->
  <rect x="30" y="40" width="360" height="360" rx="18" fill="#eef2ff" stroke="#4338ca" stroke-width="2.5"/>
  <text x="44" y="62" font-size="14" font-weight="700" fill="#4338ca">View <tspan font-weight="400">card</tspan></text>

  <rect x="150" y="80" width="120" height="36" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="210" y="105" text-anchor="middle" font-size="20" fill="#0f172a">Lörrach</text>

  <rect x="170" y="124" width="80" height="62" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="210" y="170" text-anchor="middle" font-size="40">⛅</text>

  <rect x="140" y="194" width="140" height="52" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="210" y="232" text-anchor="middle" font-size="34" fill="#0f172a">14 °C</text>

  <!-- marginTop der Zeile statt SizedBox -->
  <line x1="210" y1="250" x2="210" y2="278" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="218" y="268" font-size="11" fill="#64748b">marginTop</text>

  <rect x="50" y="282" width="320" height="96" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/>
  <text x="60" y="300" font-size="13" font-weight="700" fill="#b45309">View <tspan font-weight="400">row</tspan></text>

  <rect x="60" y="314" width="110" height="34" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="115" y="336" text-anchor="middle" font-size="13" fill="#0f172a">Wind: 8 km/h</text>

  <!-- space-between statt Spacer -->
  <line x1="176" y1="331" x2="240" y2="331" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="208" y="364" text-anchor="middle" font-size="11" fill="#64748b">space-between</text>

  <rect x="246" y="314" width="114" height="34" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="303" y="336" text-anchor="middle" font-size="12" fill="#0f172a">Teilweise bewölkt</text>

  <!-- Rechts: derselbe Aufbau im Code -->
  <line x1="438" y1="94" x2="438" y2="346" stroke="#4338ca" stroke-width="3" stroke-linecap="round"/>
  <line x1="462" y1="214" x2="462" y2="316" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>

  <g font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#334155">
    <text x="446" y="100">&lt;<tspan fill="#4338ca" font-weight="700">View</tspan> style={styles.card}&gt;</text>
    <text x="470" y="130">&lt;<tspan fill="#475569" font-weight="700">Text</tspan>&gt;Lörrach&lt;/Text&gt;</text>
    <text x="470" y="160">&lt;<tspan fill="#475569" font-weight="700">Text</tspan>&gt;⛅&lt;/Text&gt;</text>
    <text x="470" y="190">&lt;<tspan fill="#475569" font-weight="700">Text</tspan>&gt;14 °C&lt;/Text&gt;</text>
    <text x="470" y="220">&lt;<tspan fill="#b45309" font-weight="700">View</tspan> style={styles.row}&gt;</text>
    <text x="494" y="250">&lt;<tspan fill="#475569" font-weight="700">Text</tspan>&gt;Wind …&lt;/Text&gt;</text>
    <text x="494" y="280">&lt;<tspan fill="#475569" font-weight="700">Text</tspan>&gt;Teilweise …&lt;/Text&gt;</text>
    <text x="470" y="310">&lt;/<tspan fill="#b45309" font-weight="700">View</tspan>&gt;</text>
    <text x="446" y="340">&lt;/<tspan fill="#4338ca" font-weight="700">View</tspan>&gt;</text>
  </g>
</svg>
